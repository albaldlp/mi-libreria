<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Cafetería Garajera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  /* ============================================================
     PALETA — sacada de la imagen de referencia: puertas verde
     azulado, madera cálida, sakura rosa, tarros de terracota.
     ============================================================ */
  :root{
    --crema:      #F6E9D0;
    --teal:       #3B5D56;
    --teal-osc:   #274038;
    --sakura:     #F3B8C4;
    --sakura-osc: #D98CA0;
    --terracota:  #C97B4A;
    --madera:     #8B6239;
    --tinta:      #2E241A;
    --dorado:     #E0B15C;
  }

  * { box-sizing: border-box; }

  body{
    margin: 0;
    font-family: 'Inter', sans-serif;
    color: var(--tinta);
    background: var(--teal-osc);
    overflow-x: hidden;
  }

  .titulo-display{ font-family: 'Kosugi Maru', sans-serif; }

  /* ============================================================
     PÉTALOS QUE CAEN — flotan sobre todo, todo el rato.
     ============================================================ */
  .petalo{
    position: fixed;
    top: -20px;
    width: 12px;
    height: 12px;
    background: var(--sakura);
    border-radius: 0 60% 0 60%;
    opacity: 0.9;
    pointer-events: none;
    z-index: 60;
    animation-name: caer;
    animation-timing-function: linear;
  }

  @keyframes caer{
    to{ transform: translateY(105vh) translateX(var(--deriva, 40px)) rotate(360deg); opacity: 0.15; }
  }

  /* ============================================================
     ESCENA 1: ENTRADA CON CORTINA DE CUENTAS
     ============================================================ */
  #escena-entrada{
    position: fixed;
    inset: 0;
    z-index: 90;
    background:
      radial-gradient(circle at 50% 15%, rgba(224,177,92,0.25), transparent 60%),
      linear-gradient(var(--teal), var(--teal-osc));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    transition: opacity 1s ease, visibility 1s ease;
  }

  #escena-entrada.entrado{
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .rotulo-entrada{
    text-align: center;
    color: var(--crema);
    margin: 36px 0 8px;
  }
  .rotulo-entrada h1{ font-size: clamp(1.8rem, 5vw, 2.6rem); margin: 0 0 6px; }
  .rotulo-entrada p{ margin: 0; font-size: 14px; color: rgba(246,233,208,0.75); }

  #cortina{
    position: relative;
    flex: 1;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 14px;
    padding-top: 24px;
    cursor: pointer;
    touch-action: none;
  }

  .hilo{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    transform-origin: top center;
    transition: transform 0.4s cubic-bezier(.34,1.6,.5,1);
  }
  .hilo.tocado{ transform: rotate(var(--angulo, 8deg)); }

  .cuenta{
    width: 20px;
    height: 20px;
    border-radius: 50%;
    box-shadow: inset -3px -3px 4px rgba(0,0,0,0.25), inset 2px 2px 3px rgba(255,255,255,0.3);
  }

  #boton-entrar{
    font-family: 'Kosugi Maru', sans-serif;
    font-size: 16px;
    color: var(--tinta);
    background: var(--crema);
    border: none;
    border-radius: 999px;
    padding: 12px 30px;
    margin: 22px 0 34px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.35);
  }
  #boton-entrar:hover{ background: var(--sakura); }
  #boton-entrar:focus-visible{ outline: 3px solid var(--dorado); outline-offset: 3px; }

  /* ============================================================
     ESCENA 2: LA CAFETERÍA — imagen estática de fondo
     ============================================================ */
  #cafeteria{
    position: relative;
    min-height: 100vh;
    padding: 36px 16px 60px;
    background: var(--crema);
  }

  header.encabezado{
    text-align: center;
    margin-bottom: 28px;
  }
  header.encabezado h1{
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    margin: 0 0 8px;
    color: var(--teal-osc);
  }
  header.encabezado p{ margin: 0; color: #6b5a42; font-size: 15px; }

  /* contenedor de la imagen: mantiene su proporción real,
     así los libros escondidos quedan siempre en el sitio correcto */
  .escena-imagen{
    position: relative;
    max-width: 1100px;
    margin: 0 auto;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }

  .escena-imagen img{
    display: block;
    width: 100%;
    height: auto;
  }

  /* --- libros escondidos, con la misma paleta que la ilustración --- */
  .libro-oculto{
    position: absolute;
    width: 3.2%;
    aspect-ratio: 3 / 2;
    background: var(--sakura-osc);
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 2px;
    cursor: pointer;
    box-shadow: 0 0 0 2px rgba(224,177,92,0.0), 0 2px 6px rgba(0,0,0,0.35);
    opacity: 0.88;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }
  .libro-oculto:hover, .libro-oculto:focus-visible{
    transform: scale(1.3) rotate(-4deg);
    box-shadow: 0 0 0 3px var(--dorado), 0 4px 10px rgba(0,0,0,0.4);
    opacity: 1;
  }
  .libro-oculto:focus-visible{ outline: none; }

  .pista{
    text-align: center;
    color: #6b5a42;
    font-size: 13px;
    margin-top: 18px;
  }

  /* ============================================================
     POPUP / MODAL DE CADA LIBRO
     ============================================================ */
  #fondo-modal{
    position: fixed;
    inset: 0;
    background: rgba(39,64,56,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  #fondo-modal.visible{ display: flex; }

  .tarjeta-modal{
    background: var(--crema);
    border-radius: 14px;
    max-width: 420px;
    width: 100%;
    padding: 26px;
    position: relative;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    border: 3px solid var(--dorado);
  }

  #cerrar-modal{
    position: absolute;
    top: 12px; right: 14px;
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--teal-osc);
  }
  #cerrar-modal:focus-visible{ outline: 2px solid var(--dorado); }

  .portada-modal{
    width: 90px; height: 130px;
    margin: 0 auto 14px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Kosugi Maru', sans-serif;
    font-size: 28px;
    color: var(--crema);
    box-shadow: 0 6px 14px rgba(0,0,0,0.3);
    object-fit: cover;
  }

  .tarjeta-modal h2{
    text-align: center;
    margin: 0 0 4px;
    font-size: 22px;
    color: var(--teal-osc);
  }
  .autor-modal{
    text-align: center;
    font-style: italic;
    color: #7a6650;
    margin: 0 0 14px;
    font-size: 14px;
  }
  .sinopsis-modal{
    font-size: 14px;
    line-height: 1.55;
    color: #4a3c2c;
    margin: 0 0 14px;
  }
  .puntuacion-modal{
    text-align: center;
    font-size: 20px;
    letter-spacing: 3px;
    color: var(--terracota);
  }

  @media (prefers-reduced-motion: reduce){
    .petalo{ animation: none; display: none; }
  }

</style>
</head>
<body>

<!-- ============================================================
     ESCENA DE ENTRADA: cortina de cuentas musical
     ============================================================ -->
<div id="escena-entrada">
  <div class="rotulo-entrada">
    <h1 class="titulo-display">喫茶店 · Mi Cafetería</h1>
    <p>Mueve el cursor sobre la cortina para "tocarla"</p>
  </div>
  <div id="cortina"></div>
  <button id="boton-entrar">Entrar en la cafetería →</button>
</div>

<!-- ============================================================
     ESCENA PRINCIPAL: imagen estática + libros escondidos
     ============================================================ -->
<div id="cafeteria">
  <header class="encabezado">
    <h1 class="titulo-display">Mi Cafetería Garajera</h1>
    <p>Hay libros escondidos en la escena. Búscalos y haz clic.</p>
  </header>

  <div class="escena-imagen">
    <!--
      La imagen se llama "cafeteria.jpg" y tiene que estar SIEMPRE
      en la misma carpeta que este index.html al subirla a GitHub,
      si no, no se verá.
    -->
    <img src="cafeteria.jpg" alt="Fachada de la cafetería japonesa con mesas, sillas y estanterías">

    <!--
      Cada libro-oculto se coloca con "top" y "left" en PORCENTAJE
      (0% a 100%) sobre la imagen, así se queda bien puesto en
      cualquier pantalla. Ajusta los números para moverlos.
    -->
    <div class="libro-oculto" data-libro="0" style="top: 78%; left: 22%;" tabindex="0" aria-label="Libro escondido 1"></div>
    <div class="libro-oculto" data-libro="1" style="top: 74%; left: 46%;" tabindex="0" aria-label="Libro escondido 2"></div>
    <div class="libro-oculto" data-libro="2" style="top: 80%; left: 62%;" tabindex="0" aria-label="Libro escondido 3"></div>
    <div class="libro-oculto" data-libro="3" style="top: 47%; left: 71%;" tabindex="0" aria-label="Libro escondido 4"></div>
    <div class="libro-oculto" data-libro="4" style="top: 33%; left: 78%;" tabindex="0" aria-label="Libro escondido 5"></div>
  </div>

  <p class="pista">5 libros escondidos. ¿Los has encontrado todos?</p>
</div>

<!-- ============================================================
     MODAL / POPUP DEL LIBRO
     ============================================================ -->
<div id="fondo-modal">
  <div class="tarjeta-modal">
    <button id="cerrar-modal" aria-label="Cerrar">✕</button>
    <div class="portada-modal" id="portada-modal"></div>
    <h2 id="titulo-modal"></h2>
    <p class="autor-modal" id="autor-modal"></p>
    <p class="sinopsis-modal" id="sinopsis-modal"></p>
    <p class="puntuacion-modal" id="puntuacion-modal"></p>
  </div>
</div>

<script>

  /* ============================================================
     👇 ESTA ES LA PARTE QUE TIENES QUE TOCAR 👇

     Un libro por cada "libro-oculto" del HTML de arriba
     (el índice 0 es el primero, 1 el segundo, etc).

     - portada: déjalo en "" para usar un color con las iniciales,
       o pon la URL de una imagen para mostrar la portada real.
     ============================================================ */

  const libros = [
    {
      titulo: "Cien años de soledad",
      autor: "Gabriel García Márquez",
      sinopsis: "La historia de la familia Buendía en el pueblo mítico de Macondo, a lo largo de siete generaciones.",
      puntuacion: 5,
      portada: ""
    },
    {
      titulo: "Sapiens",
      autor: "Yuval Noah Harari",
      sinopsis: "Un repaso a la historia de la humanidad desde la Edad de Piedra hasta la actualidad.",
      puntuacion: 4,
      portada: ""
    },
    {
      titulo: "El Eternauta",
      autor: "Héctor Germán Oesterheld",
      sinopsis: "Clásico del cómic argentino sobre una invasión alienígena en Buenos Aires.",
      puntuacion: 5,
      portada: ""
    },
    {
      titulo: "Rayuela",
      autor: "Julio Cortázar",
      sinopsis: "Una novela que se puede leer en varios órdenes distintos, a elección del lector.",
      puntuacion: 4,
      portada: ""
    },
    {
      titulo: "Persépolis",
      autor: "Marjane Satrapi",
      sinopsis: "Novela gráfica autobiográfica sobre crecer durante la revolución iraní.",
      puntuacion: 5,
      portada: ""
    }
  ];

  /* ============================================================
     👆 A partir de aquí es el "motor". No hace falta tocarlo.
     ============================================================ */

  /* ---------- Pétalos cayendo ---------- */
  function crearPetalo(){
    const petalo = document.createElement('div');
    petalo.className = 'petalo';
    const inicioX = Math.random() * window.innerWidth;
    const duracion = 6 + Math.random() * 6;
    const deriva = (Math.random() * 160 - 80) + 'px';
    petalo.style.left = inicioX + 'px';
    petalo.style.setProperty('--deriva', deriva);
    petalo.style.animationDuration = duracion + 's';
    petalo.style.background = Math.random() > 0.5 ? 'var(--sakura)' : '#ffffff';
    document.body.appendChild(petalo);
    setTimeout(() => petalo.remove(), duracion * 1000);
  }
  setInterval(crearPetalo, 400);

  /* ---------- Cortina de cuentas ---------- */
  const cortina = document.getElementById('cortina');
  const numHilos = 14;
  const coloresCuentas = ['#F3B8C4', '#3B5D56', '#F6E9D0', '#E0B15C', '#FFFFFF'];
  const notas = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];

  for(let i = 0; i < numHilos; i++){
    const hilo = document.createElement('div');
    hilo.className = 'hilo';
    hilo.dataset.nota = notas[i % notas.length];
    const numCuentas = 6 + Math.floor(Math.random() * 3);
    for(let j = 0; j < numCuentas; j++){
      const cuenta = document.createElement('div');
      cuenta.className = 'cuenta';
      cuenta.style.background = coloresCuentas[Math.floor(Math.random() * coloresCuentas.length)];
      hilo.appendChild(cuenta);
    }
    cortina.appendChild(hilo);
  }

  let contextoAudio = null;
  function obtenerContexto(){
    if(!contextoAudio){
      contextoAudio = new (window.AudioContext || window.webkitAudioContext)();
    }
    return contextoAudio;
  }

  function tocarNota(frecuencia){
    try{
      const ctx = obtenerContexto();
      const ahora = ctx.currentTime;
      const osc = ctx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(frecuencia, ahora);
      const ganancia = ctx.createGain();
      ganancia.gain.setValueAtTime(0.0001, ahora);
      ganancia.gain.linearRampToValueAtTime(0.18, ahora + 0.015);
      ganancia.gain.exponentialRampToValueAtTime(0.0001, ahora + 0.8);
      osc.connect(ganancia).connect(ctx.destination);
      osc.start(ahora);
      osc.stop(ahora + 0.8);
    }catch(error){
      console.log('El audio no está disponible en este navegador', error);
    }
  }

  let ultimoHiloTocado = null;
  cortina.addEventListener('pointermove', (evento) => {
    const objetivo = evento.target.closest('.hilo');
    if(!objetivo || objetivo === ultimoHiloTocado) return;
    ultimoHiloTocado = objetivo;

    const angulo = (Math.random() * 16 - 8).toFixed(1) + 'deg';
    objetivo.style.setProperty('--angulo', angulo);
    objetivo.classList.add('tocado');
    tocarNota(parseFloat(objetivo.dataset.nota));

    setTimeout(() => objetivo.classList.remove('tocado'), 400);
  });
  cortina.addEventListener('pointerleave', () => { ultimoHiloTocado = null; });

  /* ---------- Entrar en la cafetería ---------- */
  document.getElementById('boton-entrar').addEventListener('click', () => {
    document.getElementById('escena-entrada').classList.add('entrado');
  });

  /* ---------- Modal de cada libro ---------- */
  const fondoModal = document.getElementById('fondo-modal');
  const iniciales = (texto) => texto.split(' ').map(p => p[0]).slice(0,2).join('').toUpperCase();
  const coloresPortada = ['#3B5D56', '#D98CA0', '#C97B4A', '#E0B15C', '#8B6239'];

  document.querySelectorAll('.libro-oculto').forEach(elemento => {
    elemento.addEventListener('click', () => abrirModal(elemento.dataset.libro));
    elemento.addEventListener('keydown', (evento) => {
      if(evento.key === 'Enter' || evento.key === ' '){
        evento.preventDefault();
        abrirModal(elemento.dataset.libro);
      }
    });
  });

  function abrirModal(indice){
    const libro = libros[indice];
    if(!libro) return;

    document.getElementById('titulo-modal').textContent = libro.titulo;
    document.getElementById('autor-modal').textContent = libro.autor;
    document.getElementById('sinopsis-modal').textContent = libro.sinopsis;
    document.getElementById('puntuacion-modal').textContent = '★'.repeat(libro.puntuacion) + '☆'.repeat(5 - libro.puntuacion);

    const portada = document.getElementById('portada-modal');
    if(libro.portada){
      portada.style.background = 'none';
      portada.innerHTML = `<img src="${libro.portada}" alt="Portada de ${libro.titulo}" style="width:100%;height:100%;border-radius:4px;object-fit:cover;">`;
    } else {
      portada.style.background = coloresPortada[indice % coloresPortada.length];
      portada.innerHTML = iniciales(libro.titulo);
    }

    fondoModal.classList.add('visible');
  }

  document.getElementById('cerrar-modal').addEventListener('click', () => {
    fondoModal.classList.remove('visible');
  });
  fondoModal.addEventListener('click', (evento) => {
    if(evento.target === fondoModal) fondoModal.classList.remove('visible');
  });
  document.addEventListener('keydown', (evento) => {
    if(evento.key === 'Escape') fondoModal.classList.remove('visible');
  });

</script>
</body>
</html>
